# Build gate: compile the extension, run the layers that need no .NET SDK, and prove it still packs.
#
# The complete suite (`node tests/runner.js`) also builds and runs the C# preview host and the
# generated C#/VB projects, so it needs the .NET SDK — that is the `full-suite` job below, which only
# runs when started by hand (it is slower and depends on the runner image's native libraries).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile, logic + webview tests, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix tests --no-audit --no-fund
      - name: Compile the extension (tsc)
        run: npm run compile
      - name: Check the webview script parses
        run: node --check media/designer.js
      - name: Logic tests (t2)
        run: node tests/runner.js --layer t2-logic
      - name: Webview tests (t3)
        run: node tests/runner.js --layer t3-webview
      - name: Package the VSIX
        run: |
          mkdir -p .artifacts
          npm run package -- --out .artifacts/avalonia-designer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: .artifacts/avalonia-designer.vsix
          if-no-files-found: error
      # The runner writes the assertion details to tests/out/report.md rather than the console, so
      # without this a red run says only "N passed, 1 failed" and nothing else.
      - name: Test report (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            tests/out/report.md
            tests/out/log.jsonl
          if-no-files-found: ignore

  full-suite:
    name: Full suite (needs the .NET SDK)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 builds the bundled preview host, 10.0 the projects the extension generates.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Native libraries the headless renderer needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libice6 libsm6
      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix tests --no-audit --no-fund
      - name: Compile the extension (tsc)
        run: npm run compile
      - name: Full test suite (layers t0–t5)
        run: node tests/runner.js
      - name: Test report (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-report
          path: |
            tests/out/report.md
            tests/out/log.jsonl
          if-no-files-found: ignore
