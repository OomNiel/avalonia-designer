# Release to the Visual Studio Marketplace. Manual only, on purpose: a published version number can
# never be reused, so a human decides when a build goes out.
#
# One-time setup:
#   1. Create the publisher the manifest names (package.json → "publisher") at
#      https://marketplace.visualstudio.com/manage
#   2. Create an Azure DevOps Personal Access Token with the scope "Marketplace → Manage",
#      then store it in this repository as the secret VSCE_PAT (Settings → Secrets → Actions).
#      NOTE: Azure DevOps retires *global* PATs ("All accessible organizations") on 1 December 2026,
#      so this PAT-based publish stops working on that date. From then on publishing needs Entra ID
#      auth (`vsce publish --azure-credential`, vsce >= 2.26.1) with the identity added as a
#      publisher member — see PUBLISHING.md part G.
#   3. Bump "version" in package.json, commit and tag BEFORE running this workflow.
#
# A run WITHOUT the secret is not a failure: it builds, tests, packages and uploads the VSIX, prints a
# warning and says so in the job summary. That is deliberate — a red run for a known setup gap only
# produces a failure email, and the missing secret is already reported by the warning + summary. A
# publish that is attempted and fails still fails the job (that one is real news).
name: Release

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish onto the pre-release channel instead of the normal listing (off by default)
        type: boolean
        default: false
      dry_run:
        description: Dry run — build, test and package, but do not publish
        type: boolean
        default: true

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Decide up front whether this run can publish, so a missing token is a warning here rather than
      # a failed Publish step at the very end (after the full suite has already run).
      - name: Preflight — is publishing configured?
        id: preflight
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT is not set — this run builds, tests and packages, but will NOT publish. Add the token (Settings → Secrets and variables → Actions) and run this workflow again."
          else
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Native libraries the headless renderer needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libice6 libsm6
      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix tests --no-audit --no-fund
      - name: Compile the extension (tsc)
        run: npm run compile
      - name: Full test suite (never publish an untested build)
        run: node tests/runner.js
      - name: Package
        run: |
          mkdir -p .artifacts
          npx --yes @vscode/vsce@2.15.0 package --out .artifacts/avalonia-designer.vsix
      - name: Publish
        id: publish
        if: ${{ inputs.dry_run == false && steps.preflight.outputs.can_publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            npx --yes @vscode/vsce@2.15.0 publish --pre-release
          else
            npx --yes @vscode/vsce@2.15.0 publish
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: .artifacts/avalonia-designer.vsix
          if-no-files-found: error
      # Says what actually happened, in the job summary, so a green run is never mistaken for a
      # published one. `steps.publish.outcome` is "skipped" when the step did not run at all.
      - name: What this run did
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
          CAN_PUBLISH: ${{ steps.preflight.outputs.can_publish }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL=$([ "$PRE_RELEASE" = "true" ] && echo "pre-release" || echo "stable")
          if [ "$PUBLISHED" = "success" ]; then
            {
              echo "## Published \`$VERSION\`"
              echo ""
              echo "\`vsce publish\` succeeded — the Marketplace now has \`$VERSION\` on the **$CHANNEL** channel."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = "true" ]; then
            {
              echo "## Dry run — nothing published"
              echo ""
              echo "Built, tested and packaged. Run again with *Dry run* off to publish \`$VERSION\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISHED" = "failure" ]; then
            {
              echo "## Publish FAILED — nothing is live"
              echo ""
              echo "\`vsce publish\` failed; see its log above. Check whether \`$VERSION\` is already"
              echo "taken — a published version number can never be reused, so a new one has to be"
              echo "chosen in \`package.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠ NOT PUBLISHED"
              echo ""
              echo "The repository secret \`VSCE_PAT\` is not set, so this run stopped short of"
              echo "publishing — it still built, tested and packaged (the VSIX is in the artifacts)."
              echo ""
              echo "Add the token under *Settings → Secrets and variables → Actions* and run this"
              echo "workflow again. \`package.json\` still holds \`$VERSION\`, so nothing is lost."
              echo "(Global Azure DevOps PATs are retired on 1 December 2026 — see \`PUBLISHING.md\` part G.)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
